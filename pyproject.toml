[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvecdb"
version = "0.1.0"
description = "A small, correct, measurable vector database and grounded-RAG workbench"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5"]

[project.optional-dependencies]
st = ["sentence-transformers>=2.7"]
bench = ["matplotlib", "hnswlib", "scikit-learn"]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
pyvecdb = "pyvecdb.cli:main"

[tool.vercel]
entrypoint = "app.py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyvecdb = ["static/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007", "UP037", "B905", "B027"]
